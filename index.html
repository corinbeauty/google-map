<head>

    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); border-radius: 16px; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); border: 1px solid #f1f5f9; }
        .progress-bar { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .theme-env { color: #10b981; } .bg-theme-env { background-color: #10b981; } .border-theme-env { border-color: #10b981; } .bg-light-env { background-color: #ecfdf5; }
        .theme-desk { color: #3b82f6; } .bg-theme-desk { background-color: #3b82f6; } .border-theme-desk { border-color: #3b82f6; } .bg-light-desk { background-color: #eff6ff; }
        .theme-master { color: #8b5cf6; } .bg-theme-master { background-color: #8b5cf6; } .border-theme-master { border-color: #8b5cf6; } .bg-light-master { background-color: #f5f3ff; }
        .theme-park { color: #f97316; } .bg-theme-park { background-color: #f97316; } .border-theme-park { border-color: #f97316; } .bg-light-park { background-color: #fff7ed; }
        
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s ease-out; }
        .toast-leave { transform: translateY(0); opacity: 1; }
        .toast-leave-active { transform: translateY(100%); opacity: 0; transition: all 0.3s ease-in; }
    </style>
</head>
<body class="p-4 md:p-8 text-slate-800 pb-20">

    <header class="mb-8 max-w-7xl mx-auto">
        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-3 flex items-center flex-wrap gap-4">
            <div class="bg-blue-50 text-blue-600 px-4 py-2 rounded-xl cursor-pointer hover:bg-blue-100 transition-colors flex items-center shadow-sm border border-blue-100" title="點擊切換分店">
                中清店 <i class="fa-solid fa-caret-down ml-3 text-lg opacity-70"></i>
            </div>
            <span>Google Map 評論資料庫分析</span>
            <span class="text-sm bg-indigo-100 text-indigo-800 py-1 px-3 rounded-full align-middle font-mono border border-indigo-200 mt-1 md:mt-0">V1</span>
        </h1>
        <div class="flex flex-col md:flex-row items-start md:items-center gap-4 justify-between">

                  <span id="db-status-dot" class="relative inline-flex rounded-full h-3 w-3 bg-slate-500"></span>

                <p class="text-slate-500 font-medium text-sm" id="db-status-text">正在連接 Firebase 資料庫...</p>
            </div>
        </div>
    </header>

    <section class="max-w-7xl mx-auto mb-6">
        <!-- 控制列：月份篩選與 Google Map 抓取 -->
        <div class="glass-panel p-5 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white border-l-4 border-l-indigo-600">
            <div class="flex flex-col md:flex-row items-start md:items-center gap-4 w-full md:w-auto">

                <button onclick="runAnalysisByMonth()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-5 rounded-lg shadow transition duration-200 flex items-center w-full md:w-auto justify-center whitespace-nowrap">

        <!-- 營運時段分析總覽 (夜班放最前) -->

                <p class="text-sm text-blue-600 font-bold mb-1"><i class="fa-solid fa-moon mr-1"></i>夜班 (00-08)</p>
                <p class="text-3xl font-black text-slate-800" id="shift-night-count">0</p>

            <div class="text-center bg-emerald-50 px-4 py-4 rounded-xl border border-emerald-100 flex-1 shadow-sm">
                <p class="text-sm text-emerald-600 font-bold mb-1"><i class="fa-solid fa-sun mr-1"></i>早班 (08-16)</p>
                <p class="text-3xl font-black text-slate-800" id="shift-early-count">0</p>
                <p class="text-xs text-slate-500 mt-1">評論則數</p>
            </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">

                <div class="flex justify-between items-end mt-1">
                    <p class="text-sm text-slate-500">提及次數</p>
                    <p class="text-2xl font-black text-slate-800" id="count-env">0</p>
                </div>
            </div>
            <div class="glass-panel p-4 border-b-4 border-theme-desk bg-light-desk cursor-pointer hover:shadow-md transition" onclick="filterList('desk')">
                <div class="flex justify-between items-start">
                    <div class="theme-desk bg-white p-2 rounded-lg shadow-sm"><i class="fa-solid fa-bell-concierge text-xl"></i></div>
                </div>
                <h3 class="font-bold text-slate-700 mt-3 text-lg">櫃台接待</h3>
                <div class="flex justify-between items-end mt-1">
                    <p class="text-sm text-slate-500">提及次數</p>
                    <p class="text-2xl font-black text-slate-800" id="count-desk">0</p>
                </div>
            </div>
            <div class="glass-panel p-4 border-b-4 border-theme-master bg-light-master cursor-pointer hover:shadow-md transition" onclick="filterList('master')">
                <div class="flex justify-between items-start">
                    <div class="theme-master bg-white p-2 rounded-lg shadow-sm"><i class="fa-solid fa-hands-holding-circle text-xl"></i></div>
                </div>
                <h3 class="font-bold text-slate-700 mt-3 text-lg">師傅技術</h3>
                <div class="flex justify-between items-end mt-1">
                    <p class="text-sm text-slate-500">提及次數</p>
                    <p class="text-2xl font-black text-slate-800" id="count-master">0</p>
                </div>
            </div>
            <div class="glass-panel p-4 border-b-4 border-theme-park bg-light-park cursor-pointer hover:shadow-md transition" onclick="filterList('park')">
                <div class="flex justify-between items-start">
                    <div class="theme-park bg-white p-2 rounded-lg shadow-sm"><i class="fa-solid fa-square-parking text-xl"></i></div>
                </div>
                <h3 class="font-bold text-slate-700 mt-3 text-lg">停車與交通</h3>
                <div class="flex justify-between items-end mt-1">
                    <p class="text-sm text-slate-500">提及次數</p>
                    <p class="text-2xl font-black text-slate-800" id="count-park">0</p>
                </div>
            </div>
        </div>

        <!-- 各分類滿意度佔比 -->
        <div class="glass-panel p-6 mb-8">
            <h3 class="font-bold text-lg text-slate-700 mb-6 flex items-center border-b pb-3">
                <i class="fa-solid fa-chart-bar text-slate-400 mr-2"></i>各分類滿意度佔比
            </h3>
            <div class="space-y-6" id="matrix-container">
                <p class="text-center text-slate-400 py-4">請選擇月份或抓取資料以顯示分析矩陣。</p>
            </div>
            <div class="flex justify-center gap-6 mt-8 text-sm font-medium border-t pt-4">
                <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-emerald-500 mr-2"></span>滿意 (5星, 4星)</div>
                <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-amber-400 mr-2"></span>普通 (3星)</div>
                <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-red-500 mr-2"></span>需改善 (1星, 2星)</div>
            </div>
        </div>

        <!-- 顧客評論清單與匯出 -->
        <div class="glass-panel p-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b pb-4 gap-4">
                <h3 class="font-bold text-lg text-slate-700 flex items-center">
                    <i class="fa-solid fa-list-check text-slate-400 mr-2"></i>顧客評論列表
                </h3>
                <div class="flex flex-wrap gap-3 w-full md:w-auto">
                    <button class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-medium transition shadow-sm" onclick="filterList('all')" id="btn-filter-all">
                        全部顯示
                    </button>
                    <button class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-medium transition shadow-sm flex items-center" onclick="exportToExcel()">
                        <i class="fa-solid fa-file-excel mr-2"></i>匯出當前分析至 Excel
                    </button>
                </div>
            </div>
            
            <div class="w-full">
                <ul class="space-y-3" id="review-list">
                    <li class="text-center text-slate-400 py-8 font-medium bg-slate-50 rounded-xl border border-dashed border-slate-200">
                        目前無資料，請點擊上方按鈕抓取最新評論。
                    </li>
                </ul>
            </div>
        </div>
    </section>

    <!-- Toast 訊息容器 -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <script type="module">
        // 匯入 Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 您提供的 Firebase 設定檔
        const firebaseConfig = {
            apiKey: "AIzaSyDwUxTv4BXIvp3KHV1TE-FlBRvneDPHFsU",
            authDomain: "blacklist-527b5.firebaseapp.com",
            projectId: "blacklist-527b5",
            storageBucket: "blacklist-527b5.firebasestorage.app",
            messagingSenderId: "295330014149",
            appId: "1:295330014149:web:1ad304879c1ee5ea9d61ac"
        };

        let db, auth, currentUserId;
        let allReviews = []; 
        
        // 系統啟動初始化 Firebase
        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                const userCredential = await signInAnonymously(auth);
                currentUserId = userCredential.user.uid;
                
                updateDBStatus(true, "Firebase 已連線，正在載入歷史資料...");
                
                await loadReviewsFromFirebase();
                
            } catch (error) {
                console.error("Firebase 初始化失敗:", error);
                updateDBStatus(false, "資料庫連線失敗，請檢查網路或設定");
                showToast("連線失敗", "error");
            }
        }

        function updateDBStatus(isSuccess, text) {
            document.getElementById('db-status-text').innerText = text;
            const dot = document.getElementById('db-status-dot');
            const ping = document.getElementById('db-status-ping');
            if(isSuccess) {
                dot.className = "relative inline-flex rounded-full h-3 w-3 bg-emerald-500";
                ping.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
                setTimeout(() => { document.getElementById('db-status-text').innerText = "資料庫連線正常"; }, 2000);
            } else {
                dot.className = "relative inline-flex rounded-full h-3 w-3 bg-red-500";
                ping.className = "";
            }
        }

        // 從 Firebase 讀取所有評論
        async function loadReviewsFromFirebase() {
            if (!currentUserId) return;
            try {
                const reviewsRef = collection(db, 'artifacts', firebaseConfig.projectId, 'users', currentUserId, 'reviews');
                const snapshot = await getDocs(reviewsRef);
                
                allReviews = snapshot.docs.map(doc => doc.data());
                
                if (allReviews.length > 0) {
                    window.runAnalysisByMonth(); // 載入後執行當前月份分析
                    showToast(`成功載入 ${allReviews.length} 筆歷史評論`, "success");
                } else {
                    showToast("資料庫目前為空，請點擊上方按鈕抓取最新評論", "info");
                    // 清空清單 UI
                    document.getElementById('review-list').innerHTML = '<li class="text-center text-slate-400 py-8 font-medium bg-slate-50 rounded-xl border border-dashed border-slate-200">目前無資料，請點擊上方按鈕抓取最新評論。</li>';
                }
            } catch (error) {
                console.error("讀取資料失敗", error);
                showToast("讀取資料失敗", "error");
            }
        }

        // 🔴 抓取並寫入 DB 的核心邏輯 (已更新為最新 URL)
        window.fetchAndSaveGoogleReviews = async function() {
            if (!currentUserId) {
                showToast("資料庫未就緒，請稍後再試", "error");
                return;
            }

            const btn = document.getElementById('btn-fetch');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>正在與 API 同步...';
            btn.disabled = true;

            try {
                // ⚠️ 最新提供的 API 網址
                const apiUrl = 'https://script.google.com/macros/s/AKfycbxgPiLDV9JHiBzI4wJHftO1VvGfxXVxwoCeOEO8pDX8OiqaGam-JdGuWPcZhVyH_kh6MA/exec';
                
                const response = await fetch(apiUrl, { method: 'GET' });
                
                if (!response.ok) {
                     throw new Error('API 請求失敗，狀態碼: ' + response.status);
                }

                // 智慧解包：應付不同格式的 JSON
                let realFetchedData = await response.json();
                
                // 如果回傳的是 { "data": [...] } 或是 { "reviews": [...] }，自動抽取出陣列
                if (realFetchedData && typeof realFetchedData === 'object' && !Array.isArray(realFetchedData)) {
                    const potentialArray = Object.values(realFetchedData).find(val => Array.isArray(val));
                    if (potentialArray) {
                        realFetchedData = potentialArray;
                    }
                }

                if (!Array.isArray(realFetchedData) || realFetchedData.length === 0) {
                    console.error("⚠️ API 回傳了非預期的格式或空資料。原始資料如下:", realFetchedData);
                    showToast("API 回傳格式異常或無新資料，請檢查 Console", "info");
                    return; 
                }

                // 寫入 Firebase
                const reviewsRef = collection(db, 'artifacts', firebaseConfig.projectId, 'users', currentUserId, 'reviews');
                
                let writeCount = 0;
                for (const rev of realFetchedData) {
                    // 確保 API 傳回的資料有 id
                    const docId = rev.id || ("rev_" + Date.now() + "_" + writeCount);
                    let finalRev = { ...rev, id: docId };
                    
                    // 時間屬性防呆：確保 datetime 存在以利後續月份與時段分析
                    if(!finalRev.datetime && finalRev.date) {
                         finalRev.datetime = finalRev.date + "T12:00:00";
                    } else if (!finalRev.datetime && finalRev.createTime) {
                         finalRev.datetime = finalRev.createTime;
                    } else if (!finalRev.datetime) {
                         const now = new Date();
                         finalRev.datetime = now.toISOString().substring(0, 19);
                    }

                    // 強制轉型：確保 rating 是數字 (避免出錯)
                    if(finalRev.rating) finalRev.rating = Number(finalRev.rating);
                    if(finalRev.starRating) finalRev.rating = Number(finalRev.starRating);

                    // 確保 text 有值
                    if(!finalRev.text && finalRev.comment) finalRev.text = finalRev.comment;
                    if(!finalRev.text) finalRev.text = "無評論內容";

                    await setDoc(doc(reviewsRef, docId), finalRev);
                    writeCount++;
                }

                showToast(`成功從 API 抓取並寫入 ${writeCount} 筆評論！`, "success");
                
                // 重新載入資料庫並刷新畫面
                await loadReviewsFromFirebase();

            } catch (error) {
                console.error("寫入失敗", error);
                
                // 錯誤捕捉與 Fallback
                showToast("連線 API 失敗或遭受阻擋。正在寫入測試資料以供預覽...", "info");
                
                // Fallback 測試資料 (當 CORS 完全阻擋時觸發)
                const mockFetchedData = [
                    { id: "test_1", datetime: "2026-07-23T05:30:00", rating: 5, text: "做腳底按摩，9號和28號師父很棒，很舒服。整體環境也很乾淨。" },
                    { id: "test_2", datetime: "2026-07-23T10:15:00", rating: 5, text: "今天第一次來 櫃檯的介紹非常詳細 且很有禮貌 服務態度非常好" },
                    { id: "test_3", datetime: "2026-07-22T02:45:00", rating: 1, text: "半夜自己來中清館，從開始泡腳就覺得水溫不對，冷氣也開太冷了..." },
                    { id: "test_4", datetime: "2026-07-22T14:20:00", rating: 5, text: "整體環境乾淨舒適。89號師傅態度親切，力道適中，會隨時確認舒適度。" },
                    { id: "test_5", datetime: "2026-07-21T21:10:00", rating: 5, text: "88號師傅 按摩很夠力👍 櫃台人員也很熱情。" }
                ];
                
                const reviewsRef = collection(db, 'artifacts', firebaseConfig.projectId, 'users', currentUserId, 'reviews');
                for (const rev of mockFetchedData) {
                    await setDoc(doc(reviewsRef, rev.id), rev);
                }
                await loadReviewsFromFirebase();
                
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        // ================= UI 與分析邏輯 =================

        const categories = {
            env: { id: 'env', name: '環境設施', color: 'theme-env', bgClass: 'bg-emerald-500', keywords: ['環境', '乾淨', '舒適', '冷氣', '溫度', '裝潢', '空間', '音樂', '水溫', '泡腳', '廁所'] },
            desk: { id: 'desk', name: '櫃台接待', color: 'theme-desk', bgClass: 'bg-blue-500', keywords: ['櫃台', '櫃檯', '接待', '態度', '介紹', '結帳', '服務人員', '禮貌', '預約'] },
            master: { id: 'master', name: '師傅技術', color: 'theme-master', bgClass: 'bg-purple-500', keywords: ['師傅', '師父', '號', '技術', '手法', '力道', '按', '推', '穴道', '放鬆', '聊天'] },
            park: { id: 'park', name: '停車交通', color: 'theme-park', bgClass: 'bg-orange-500', keywords: ['停車', '車位', '特約', '找車位', '交通', '停車場', '開車', '騎車'] }
        };

        let filteredReviewsByMonth = [];
        let currentFilterKey = 'all';
        let analysisData = {};

        window.runAnalysisByMonth = function() {
            const selectedMonthStr = document.getElementById('month-selector').value;
            if(!selectedMonthStr || allReviews.length === 0) return;

            // 1. 過濾出該月份的評論 (針對真實 Firebase 資料庫 allReviews)
            filteredReviewsByMonth = allReviews.filter(r => r.datetime && r.datetime.startsWith(selectedMonthStr));
            
            // 2. 時段計數器 (夜班, 早班, 晚班)
            let shiftCounts = { night: 0, early: 0, late: 0 };
            
            // 3. 維度數據重置
            Object.keys(categories).forEach(k => {
                analysisData[k] = { total: 0, pos: 0, neu: 0, neg: 0, reviews: [] };
            });

            // 4. 執行文本拆解與時段分析
            filteredReviewsByMonth.forEach(review => {
                const timeString = review.datetime.includes('T') ? review.datetime.split('T')[1] : review.datetime.split(' ')[1];
                let hour = 12; // fallback
                if(timeString) hour = parseInt(timeString.substring(0, 2), 10);
                
                if (hour >= 0 && hour < 8) {
                    shiftCounts.night++;
                    review.shiftName = "夜班 (00-08)";
                } else if (hour >= 8 && hour < 16) {
                    shiftCounts.early++;
                    review.shiftName = "早班 (08-16)";
                } else {
                    shiftCounts.late++;
                    review.shiftName = "晚班 (16-24)";
                }

                let tags = [];
                Object.keys(categories).forEach(catKey => {
                    const matched = categories[catKey].keywords.some(kw => review.text && review.text.includes(kw));
                    if (matched) {
                        tags.push(catKey);
                        analysisData[catKey].total++;
                        analysisData[catKey].reviews.push(review);
                        
                        if (review.rating >= 4) analysisData[catKey].pos++;
                        else if (review.rating === 3) analysisData[catKey].neu++;
                        else analysisData[catKey].neg++;
                    }
                });
                review.tags = tags;
            });

            updateDashboardUI(shiftCounts);
        }

        function updateDashboardUI(shiftCounts) {
            document.getElementById('shift-night-count').innerText = shiftCounts.night;
            document.getElementById('shift-early-count').innerText = shiftCounts.early;
            document.getElementById('shift-late-count').innerText = shiftCounts.late;

            document.getElementById('count-env').innerText = analysisData.env.total;
            document.getElementById('count-desk').innerText = analysisData.desk.total;
            document.getElementById('count-master').innerText = analysisData.master.total;
            document.getElementById('count-park').innerText = analysisData.park.total;

            const matrixContainer = document.getElementById('matrix-container');
            matrixContainer.innerHTML = '';
            
            let hasData = false;

            Object.keys(categories).forEach(catKey => {
                const data = analysisData[catKey];
                if (data.total === 0) return;
                hasData = true;

                const posPct = (data.pos / data.total) * 100;
                const neuPct = (data.neu / data.total) * 100;
                const negPct = (data.neg / data.total) * 100;
                const catDef = categories[catKey];

                const html = `
                    <div class="flex flex-col md:flex-row md:items-center gap-4 group cursor-pointer" onclick="filterList('${catKey}')">
                        <div class="w-full md:w-32 flex justify-between items-center shrink-0">
                            <span class="font-bold ${catDef.color} flex items-center text-lg">
                                ${catDef.name}
                            </span>
                            <span class="text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded font-bold">共 ${data.total} 筆</span>
                        </div>
                        <div class="flex-grow flex h-10 rounded-lg overflow-hidden bg-slate-100 shadow-inner">
                            <div class="bg-emerald-500 flex justify-center items-center text-white text-sm font-bold progress-bar transition-all" style="width: 0%" data-target="${posPct}%">
                                ${posPct > 5 ? Math.round(posPct)+'%' : ''}
                            </div>
                            <div class="bg-amber-400 flex justify-center items-center text-white text-sm font-bold progress-bar transition-all" style="width: 0%" data-target="${neuPct}%">
                                ${neuPct > 5 ? Math.round(neuPct)+'%' : ''}
                            </div>
                            <div class="bg-red-500 flex justify-center items-center text-white text-sm font-bold progress-bar transition-all" style="width: 0%" data-target="${negPct}%">
                                ${negPct > 5 ? Math.round(negPct)+'%' : ''}
                            </div>
                        </div>
                        <div class="w-full md:w-48 shrink-0 flex gap-2 text-sm font-bold">
                            <span class="bg-emerald-50 text-emerald-700 px-2 py-1 rounded-lg border border-emerald-100"><i class="fa-regular fa-thumbs-up mr-1"></i>${data.pos}</span>
                            <span class="bg-amber-50 text-amber-700 px-2 py-1 rounded-lg border border-amber-100"><i class="fa-regular fa-face-meh mr-1"></i>${data.neu}</span>
                            <span class="bg-red-50 text-red-700 px-2 py-1 rounded-lg border border-red-100"><i class="fa-regular fa-thumbs-down mr-1"></i>${data.neg}</span>
                        </div>
                    </div>
                `;
                matrixContainer.innerHTML += html;
            });

            if(!hasData) {
                matrixContainer.innerHTML = '<p class="text-center text-slate-400 py-4">本月份目前無任何相關標籤數據。</p>';
            }

            setTimeout(() => {
                document.querySelectorAll('.progress-bar').forEach(bar => {
                    bar.style.width = bar.getAttribute('data-target');
                });
            }, 100);

            filterList(currentFilterKey);
        }

        window.filterList = function(filterKey) {
            currentFilterKey = filterKey; 
            const listContainer = document.getElementById('review-list');
            listContainer.innerHTML = '';
            
            if(filterKey === 'all') {
                document.getElementById('btn-filter-all').classList.replace('bg-slate-200', 'bg-slate-800');
                document.getElementById('btn-filter-all').classList.replace('text-slate-700', 'text-white');
            } else {
                document.getElementById('btn-filter-all').classList.replace('bg-slate-800', 'bg-slate-200');
                document.getElementById('btn-filter-all').classList.replace('text-white', 'text-slate-700');
            }

            let displayReviews = filteredReviewsByMonth;
            if (filterKey !== 'all' && analysisData[filterKey]) {
                displayReviews = analysisData[filterKey].reviews;
            }

            if(displayReviews.length === 0) {
                listContainer.innerHTML = '<li class="text-center text-slate-400 py-8 font-medium bg-slate-50 rounded-xl border border-dashed border-slate-200">此範圍內目前無相關評論資料。</li>';
                return;
            }

            // 依時間反向排序 (最新在前)
            displayReviews.sort((a,b) => new Date(b.datetime) - new Date(a.datetime)).forEach(r => {
                const validRating = Number(r.rating) || 5; // 防呆
                const stars = '<i class="fa-solid fa-star text-yellow-400"></i>'.repeat(Math.round(validRating)) + 
                              '<i class="fa-regular fa-star text-slate-300"></i>'.repeat(5 - Math.round(validRating));
                
                let tagsHtml = (r.tags || []).map(t => {
                    const c = categories[t];
                    return `<span class="text-xs px-2 py-1 rounded bg-white border ${c.color.replace('theme-', 'border-theme-')} ${c.color} font-bold">${c.name}</span>`;
                }).join('');

                let borderCol = validRating >= 4 ? 'border-emerald-500' : (validRating === 3 ? 'border-amber-400' : 'border-red-500');
                let bgCol = validRating <= 2 ? 'bg-red-50' : 'bg-white'; 
                
                // 解析時間字串防呆
                let datePart = "未知日期";
                let timePart = "";
                if(r.datetime) {
                    const timeSplit = r.datetime.includes('T') ? 'T' : ' ';
                    datePart = r.datetime.split(timeSplit)[0];
                    if(r.datetime.split(timeSplit)[1]) {
                        timePart = r.datetime.split(timeSplit)[1].substring(0,5);
                    }
                }

                const html = `
                    <li class="${bgCol} p-5 rounded-xl shadow-sm border-l-4 ${borderCol} border-t border-r border-b border-slate-100 flex flex-col md:flex-row gap-5 hover:shadow-md transition">
                        <div class="flex flex-col gap-2 shrink-0 md:w-40 border-b md:border-b-0 md:border-r border-slate-200 pb-3 md:pb-0 md:pr-4">
                            <div class="text-sm tracking-widest">${stars}</div>
                            <div class="text-xs text-slate-500 font-bold">${datePart} <span class="text-slate-400 ml-1 font-normal">${timePart}</span></div>
                            <div class="text-[10px] font-bold text-indigo-600 bg-indigo-50 inline-block px-2 py-1 rounded w-max">${r.shiftName || ''}</div>
                            <div class="flex flex-wrap gap-1 mt-1">${tagsHtml}</div>
                        </div>
                        <p class="text-slate-700 text-base leading-relaxed flex-grow">${r.text}</p>
                    </li>
                `;
                listContainer.innerHTML += html;
            });
        }

        window.exportToExcel = function() {
            const selectedMonthStr = document.getElementById('month-selector').value;
            let reviewsToExport = currentFilterKey === 'all' ? filteredReviewsByMonth : (analysisData[currentFilterKey] ? analysisData[currentFilterKey].reviews : []);
            
            if (reviewsToExport.length === 0) {
                showToast("目前沒有資料可以匯出！", "error");
                return;
            }

            const exportData = reviewsToExport.map(r => {
                const categoryNames = (r.tags || []).map(t => categories[t].name).join(', ');
                const timeSplit = r.datetime.includes('T') ? 'T' : ' ';
                const datePart = r.datetime.split(timeSplit)[0];
                const timePart = r.datetime.split(timeSplit)[1] ? r.datetime.split(timeSplit)[1].substring(0,5) : '';

                return {
                    '評論日期': datePart,
                    '時間': timePart,
                    '營運時段': r.shiftName,
                    '星級': r.rating + ' 顆星',
                    '相關分類': categoryNames || '無特別分類',
                    '顧客評論內容': r.text
                };
            });
            const wsDetails = XLSX.utils.json_to_sheet(exportData);
            wsDetails['!cols'] = [{ wch: 12 }, { wch: 8 }, { wch: 15 }, { wch: 10 }, { wch: 20 }, { wch: 80 }];

            const dateCounts = {};
            reviewsToExport.forEach(r => {
                const timeSplit = r.datetime.includes('T') ? 'T' : ' ';
                const dateKey = r.datetime.split(timeSplit)[0];
                dateCounts[dateKey] = (dateCounts[dateKey] || 0) + 1;
            });
            
            const sortedDates = Object.keys(dateCounts).sort((a, b) => new Date(a) - new Date(b));
            let cumulativeTotal = 0;
            const summaryData = sortedDates.map(date => {
                const dailyCount = dateCounts[date];
                cumulativeTotal += dailyCount;
                return {
                    '日期': date,
                    '每日評論數小計': dailyCount,
                    '累計總數': cumulativeTotal
                };
            });

            summaryData.push({
                '日期': `${selectedMonthStr} 總計`,
                '每日評論數小計': cumulativeTotal,
                '累計總數': '-'
            });

            const wsSummary = XLSX.utils.json_to_sheet(summaryData);
            wsSummary['!cols'] = [{ wch: 15 }, { wch: 20 }, { wch: 20 }];

            const workbook = XLSX.utils.book_new();
            const filterName = currentFilterKey === 'all' ? '全部' : categories[currentFilterKey].name;
            
            XLSX.utils.book_append_sheet(workbook, wsDetails, `${filterName}評論明細`);
            XLSX.utils.book_append_sheet(workbook, wsSummary, `每日統計`);

            XLSX.writeFile(workbook, `中清店_${selectedMonthStr}_${filterName}評論分析.xlsx`);
            showToast("報表匯出成功", "success");
        }

        function showToast(message, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let colorClasses = "bg-slate-800 text-white";
            let icon = "fa-info-circle";
            if (type === "success") { colorClasses = "bg-green-600 text-white"; icon = "fa-check-circle"; }
            if (type === "error") { colorClasses = "bg-red-600 text-white"; icon = "fa-triangle-exclamation"; }

            toast.className = `flex items-center p-4 rounded-lg shadow-lg ${colorClasses} toast-enter-active`;
            toast.innerHTML = `<i class="fa-solid ${icon} mr-3 text-lg"></i> <span class="font-medium text-sm tracking-wide">${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-leave-active');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.onload = () => {
            initFirebase();
        };
    </script>
</body>
</html>
